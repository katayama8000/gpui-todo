[package]
name = "gpui-todo"
version = "0.1.0"
edition = "2024"
default-run = "gpui-todo"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hkdf = "0.13.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
unicode-segmentation = "1.13.3"
ureq = { version = "3.5.2", default-features = false }
